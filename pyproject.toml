[project]
name = "videoimprove-engine"
version = "0.3.0"
description = "Restauração e upscaling de vídeos antigos (VHS) com pipeline adaptativo à GPU"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
]

# Escolha UM runtime: os pacotes onnxruntime-* conflitam entre si se instalados juntos.
[project.optional-dependencies]
nvidia = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]  # RTX/GTX: CUDA e cuDNN vêm como pacotes pip
directml = ["onnxruntime-directml>=1.18"]       # Windows, qualquer GPU DX12: Intel/AMD integrada, GTX 1660, RX
openvino = ["onnxruntime-openvino>=1.18"]       # Intel (Linux ou Windows)
cpu = ["onnxruntime>=1.18"]
gui = ["pyside6-essentials>=6.8"]
dev = ["pytest>=8", "psutil"]

[project.scripts]
videoimprove = "engine.cli:main"

[project.gui-scripts]
videoimprove-gui = "gui.main_window:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
